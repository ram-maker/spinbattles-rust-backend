[package]
name = "gs-correlation"
version = "1.0.1"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
chrono = "0.4"
glob = "0.3"
regex = "1"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
zip = "8"
